name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: factory-ci
  GIT_AUTHOR_EMAIL: factory-ci@users.noreply.github.com
  GIT_COMMITTER_NAME: factory-ci
  GIT_COMMITTER_EMAIL: factory-ci@users.noreply.github.com

jobs:
  # The first three commands are harness.config.json's lint, format and types gates, verbatim.
  gates:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/python_env.mjs uv sync
      # The suite checks the vendored layer A tree against a sibling harness checkout, pinned
      # to the commit the vendored MANIFEST.json records so another repo's branch cannot move it.
      - run: |
          sha="$(python3 -c 'import json; print(json.load(open(".agents/vendor/harness/MANIFEST.json"))["sha"])')"
          git init --quiet ../harness
          git -C ../harness fetch --quiet --depth 1 https://github.com/jchen1707/harness.git "$sha"
          git -C ../harness checkout --quiet FETCH_HEAD
      - run: node scripts/python_env.mjs uv run ruff check .
      - run: node scripts/python_env.mjs uv run ruff format --check .
      - run: node scripts/python_env.mjs uv run mypy
      - run: node scripts/python_env.mjs uv run pytest tests/unit

  integration:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/python_env.mjs uv sync
      # The suite checks the vendored layer A tree against a sibling harness checkout, pinned
      # to the commit the vendored MANIFEST.json records so another repo's branch cannot move it.
      - run: |
          sha="$(python3 -c 'import json; print(json.load(open(".agents/vendor/harness/MANIFEST.json"))["sha"])')"
          git init --quiet ../harness
          git -C ../harness fetch --quiet --depth 1 https://github.com/jchen1707/harness.git "$sha"
          git -C ../harness checkout --quiet FETCH_HEAD
      - run: node scripts/python_env.mjs uv run pytest tests/integration
