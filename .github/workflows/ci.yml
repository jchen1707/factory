name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: factory-ci
  GIT_AUTHOR_EMAIL: factory-ci@users.noreply.github.com
  GIT_COMMITTER_NAME: factory-ci
  GIT_COMMITTER_EMAIL: factory-ci@users.noreply.github.com

jobs:
  # The first three commands are harness.config.json's lint, format and types gates, verbatim.
  gates:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/python_env.mjs uv sync
      # The suite checks the vendored layer A tree against a sibling harness checkout.
      - run: git clone --quiet --depth 1 --branch v2 https://github.com/jchen1707/harness.git ../harness
      - run: node scripts/python_env.mjs uv run ruff check .
      - run: node scripts/python_env.mjs uv run ruff format --check .
      - run: node scripts/python_env.mjs uv run mypy
      - run: node scripts/python_env.mjs uv run pytest tests/unit

  integration:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/python_env.mjs uv sync
      # The suite checks the vendored layer A tree against a sibling harness checkout.
      - run: git clone --quiet --depth 1 --branch v2 https://github.com/jchen1707/harness.git ../harness
      - run: node scripts/python_env.mjs uv run pytest tests/integration
