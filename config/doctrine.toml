# The skills a sandboxed builder can invoke by name, as `doctrine:<skill>`. `doctrine.py`
# copies them out of the plugin cache (`~/.claude/plugins/cache/<marketplace>/<plugin>/
# <version>/`) into one read-only plugin, names them in the builder's prompt, and
# `factory doctor` checks every one is installed at the pinned version.
#
# Nothing else loads in the sandbox. pstack stays out: add it here as one more source to
# change that. `implement` is not listed: the builder's prompt inlines it.

[sources.mattpocock-skills]
marketplace = "claude-plugins-official"
version     = "1.2.3"
skills      = ["tdd", "code-review", "codebase-design", "diagnosing-bugs", "research", "resolving-merge-conflicts"]
