# Model and effort routing — §4.5. Hot-reloaded on every tick; validated on every
# read. A failing validation refuses to start rather than falling back to a default,
# because a factory silently running every role on one model looks identical to one
# routing correctly.

[defaults]
provider = "codex"

[roles.planner]
model  = "gpt-6-astra"
effort = "medium"                  # the plan is copied into every later step

[roles.builder]
model  = "gpt-6-astra"
# Was "xhigh". Dropped a step after BAC-4's four re-runs exhausted the Codex credit:
# each implement attempt spent 7-16 M input tokens, and the defects those runs found
# were all in the factory's own plumbing, not in what the builder wrote. "medium" is
# the next step down if this is still too expensive; "max" is above, and "ultra" is
# never routable — the validation refuses it.
effort = "low"

[roles.reviewer]
model  = "gpt-5.6-sol"             # MUST differ from roles.builder.model
effort = "medium"

[roles.synthesiser]
model  = "gpt-5.6-luna"
effort = "high"                    # merges findings; it does not read the diff

[roles.documenter]
model  = "gpt-5.6-luna"
effort = "high"

[budget]
usd_per_run = 50.0                 # hard ceiling; the run blocks, never mid-write
usd_warn_at = 30.0

# The measured catalogue, seeded from ~/.codex/models_cache.json
# (client_version 0.147.0, fetched 2026-08-20T23:00:06Z) — p0-12-models.md.
#
# It is here for two reasons. The console's context denominator is
# `context_window × effective_percent / 100`, and P0-7 proved the event stream
# carries neither number: `thread.started` holds `thread_id` and nothing else, so
# the denominator can only come from a table. And routing validation needs the list
# of models that exist; reading it from the live cache is authoritative, but a table
# that omitted a model the validation would accept is a table that has drifted, so
# both are kept and `factory doctor` reports the difference.
#
# `hidden = true` marks a model the cache lists with `visibility: hide`. It exists,
# so validation accepts it; it is not a routing target and the console says so.

[models."gpt-5.6-sol"]
display = "GPT-5.6-Sol"
default_effort = "low"
supported_efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
context_window = 272000
effective_percent = 95
hidden = false

[models."gpt-5.6-terra"]
display = "GPT-5.6-Terra"
default_effort = "medium"
supported_efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
context_window = 272000
effective_percent = 95
hidden = false

