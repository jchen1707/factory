# Model and effort routing — §4.5. Hot-reloaded on every tick; validated on every
# read. A failing validation refuses to start rather than falling back to a default,
# because a factory silently running every role on one model looks identical to one
# routing correctly.
#
# The roles below are the operator default set on 2026-10-06, when the factory moved to
# Anthropic models only. Change any of them here or on the console's settings page.

[roles.planner]
model  = "claude-opus-5-5"
effort = "high"                    # the plan is copied into every later step

[roles.builder]
model  = "claude-opus-5-5"
effort = "medium"

[roles.reviewer]
model  = "claude-fable-5-1"        # MUST differ from roles.builder.model
effort = "high"

[roles.synthesiser]
model  = "claude-sonnet-5-5"
effort = "medium"                  # merges findings; it does not read the diff

[roles.documenter]
model  = "claude-sonnet-5-5"
effort = "medium"

[budget]
usd_per_run = 50.0                 # hard ceiling; the run blocks, never mid-write
usd_warn_at = 30.0
max_turns   = 200                  # per launch (`claude --max-turns`); a role may override it

# The catalogue, and the only one: routing reads nothing outside this file. A role must
# name a full model id from this table. Aliases such as `opus` are refused because they
# move when a new model ships.
#
# `context_window` is Claude Code's `result.modelUsage[<id>].contextWindow`, measured
# 2026-10-07 UTC with `claude -p --model <id>` (Claude Code 2.1.292). `supported_efforts` and
# `default_effort` are the Claude Code model catalog's effort options and recommended
# badge, read the same day. A model with no `supported_efforts` takes no effort, and a
# role routed to it must not name one.

[models."claude-fable-5-1"]
context_window = 1000000
supported_efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"

[models."claude-opus-5-5"]
context_window = 1000000
supported_efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "medium"

[models."claude-sonnet-5-5"]
context_window = 1000000
supported_efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "medium"

[models."claude-opus-4-7"]
context_window = 1000000
supported_efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "xhigh"

[models."claude-sonnet-4-6"]
# Claude Code reports 200000 here although the API offers this model a 1M window.
context_window = 200000
supported_efforts = ["low", "medium", "high", "max"]
default_effort = "high"

[models."claude-haiku-4-5-20251001"]
# The catalog lists its thinking as "none", and a run with `--effort xhigh` recorded no
# applied effort.
context_window = 200000
supported_efforts = []
