# Token → USD, §18.3.
#
# Every row here is a Claude price from `Software Factory.md` §7, and the factory
# drives **Codex**. So nothing in this file is priced today: P0-7 confirmed the
# usage object carries `input_tokens`, `cached_input_tokens`,
# `cache_write_input_tokens`, `output_tokens` and `reasoning_output_tokens` — and
# no cost field at all (`total_cost_usd` is a Claude Code field and must not be
# assumed here). Until an OpenAI price is entered deliberately, the factory records
# token counts with `usd = NULL` and says "cost: token counts only" rather than
# reporting a number it cannot defend. A missing model is never priced at zero.
#
# `effective_until` exists because the note records Sonnet 5's introductory rate
# expiring; `factory doctor` warns on a row past its date rather than quietly
# costing a run at last month's price.

[[model]]
name = "claude-opus-5"
input_per_mtok = 5.0
output_per_mtok = 25.0

[[model]]
name = "claude-haiku-4-5"
input_per_mtok = 1.0
output_per_mtok = 5.0

