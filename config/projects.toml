# The project registry — §10.1. The single place a stack fact lives in layer D.
#
# Everything here is read; nothing here is written by the factory. Changing a
# project's `template`, mount set or `static_mcp` changes a sandbox specification
# that `sbx` fixes at creation time (§9.1), so an edit to one of those three keys
# is only real once the sandbox is recreated under a new name.

[vault]
# Host-scope name (§9.2). The factory emits OBSIDIAN_VAULT_DIRECTORY into the
# sandbox and never prints the value.
path = "/Users/james/Documents/Obsidian Vault"
# What layer A's own hooks own, and therefore the only writes a run may make.
# Anything else is `blocked: vault-write-outside-allowlist` (§8.5).
write_allowlist = ["Project Learnings/**", "_VAULT_INDEX.md"]
# Excluded from the before/after diff, not from the mount: `.obsidian` records UI
# state that changes when James merely opens a pane, and attributing that to the
# run would be a false positive every time (p0-13).
snapshot_exclude = [".obsidian", ".git", ".trash"]

[defaults]
worktree_subdir = ".factory/worktrees"
max_attempts = 3
max_total_attempts = 5
disk_min_free_gb = 20
# Per-project write concurrency (§11.3). Raising it above 1 is a deliberate act.
concurrency_per_project = 1
# §8.7's per-sandbox deny mechanism — the same one the plan assigns to `factory-review-*`
# — applied to every factory sandbox at creation. This is the compensating control for
# the one secret that cannot be kept out of the VM: `sbx` uploads `mcpgateway` into every
# sandbox whenever any MCP server is registered on the host, and has no per-sandbox
# opt-out. The static MCP set is empty (§13.1), so the gateway should serve nothing; this
# denies the endpoint as well, so the claim is enforced rather than merely intended.
# Measured 2026-08-21 on a factory-created sandbox — see p0-5's correction.
deny_network = ["mcp.linear.app"]

[defaults.planning]
# `worktree_ready -> planning` when the ticket is "large or ambiguous" (§5.2).
# The plan does not fix a threshold, so this is one, and it is off by default:
# Phase 1's expected output is a single implement attempt, and a planning step
# that fires on its own would spend a second model run before anyone has seen the
# first one. `factory run --plan` forces it; attempt 3 of the §16.3a ladder enters
# `planning` regardless of this setting.
auto = false
acceptance_criteria_over = 12
description_chars_over = 8000

[defaults.redphase]
# §15.3 / §24.12. Only the inconclusive row is a judgement; the two blocking rows
# are not reachable from this file.
inconclusive = "report"
# Seeded from P0-14's measured 17 %, with headroom (p0-14-red-phase.md).
inconclusive_alarm_pct = 40

[defaults.gc]
# §16.5. Every number is a floor on how long the factory keeps something, never a
# promise to delete it — a pushed branch, an open PR and a sandbox the factory did
# not create are untouchable at any age.
worktree_days = 7
sandbox_idle_hours = 12
# Far above the idle hours on purpose: stopping a sandbox costs a restart, removing
# one costs rebuilding the image cache.
sandbox_rm_days = 14
artifact_days = 60

[defaults.timeouts_seconds]
# §5.1's per-state timeouts. The gate suite measures under three seconds on both
# host and sandbox (p0-10), so every number here is dominated by the model.
claimed = 60
context_loaded = 300
sandbox_creating = 600
sandbox_ready = 300
worktree_ready = 300
planning = 1800
implementing = 5400
verifying = 2700
reviewing = 2700
pr_ready = 600

# ------------------------------------------------------------------------------
# RETIRED 2026-08-31 — python-harness, team BAC.
#
# Commented out rather than deleted, because `Registry.resolve` refuses a team two
# projects claim (`test_two_projects_claiming_one_team_refuse_to_load`) and BAC now
# routes to nemoclaw-dev. Leaving both blocks live would not degrade routing, it would
# raise on *every* BAC ticket.
#
# The comments below are measured findings, not description — the `-2` sandbox suffix,
# the acknowledged env-credential name, the `UV_PROJECT_ENVIRONMENT` bind-mount fix.
# They cost real runs to learn and are the reason this is commented rather than dropped:
# restoring the project is uncommenting this block and giving nemoclaw-dev a different
# team key.
# ------------------------------------------------------------------------------
# [projects.python-harness]
# team           = "BAC"
# path           = "/Users/james/python-harness"
# remote         = "https://github.com/jchen1707/python-harness.git"
# # NOT main: main is generated by generate-main.yml and never hand-authored (§2.2).
# base_branch    = "v2"
# stack          = "python"
# # P0-3 resolved §8.3's decision rule to its first branch: the stock image carries
# # node v22.22.1 and uv 0.9.26, so the layer-A .mjs hooks can spawn and no Python
# # template is needed. "" means the agent default (docker/sandbox-templates:codex-docker).
# template       = ""
# kits           = []
# static_mcp     = []
# # Not `factory-build-python-harness`. That name carries a `github` credential
# # binding that `sbx secret ls` does not show and `sbx secret rm` cannot clear —
# # almost certainly recorded when the first run created it while the secret was
# # still global, and it survives `sbx rm`. The factory's exact `sbx create` argv
# # produces a clean sandbox under any other name, so the suffix is the whole fix.
# # Measured one variable at a time in `docs/discovery/p1-1-in-image-codex.md`.
# # Do not "tidy" this back: `preflight:no-secrets-in-vm` blocks every run under
# # the old name, correctly.
# build_sandbox  = "factory-build-python-harness-2"
# review_sandbox = "factory-review-python-harness"
# vault_mount    = "rw"
# network_allow  = ["pypi.org", "*.pythonhosted.org", "astral.sh", "github.com"]
# # The measured fix for the bind-mount hazard: a sandbox `uv sync` against the
# # bind-mounted workspace wrote a linux-aarch64 venv over the host's .venv and left
# # .venv/bin/python a broken symlink (p0-3-toolchain.md). Pointing uv at a VM-local
# # path was verified to keep both sides healthy across two full gate suites.
# #
# # Measured 2026-08-22 in three sandboxes at once — this project's build sandbox, its
# # reviewer, and a freshly created clone sandbox for the other project. Each carried a
# # 40-character `gho_` value in the environment while `sbx inspect` reported only the
# # gateway credential, so `preflight:no-secrets-in-vm` passed all three. That check reads
# # proxy-managed secrets and structurally cannot see an env var; `no-capability-env` reads
# # the other channel, and is why this line has to exist at all.
# #
# # Acknowledged rather than blocked, on two further measurements: the token does not
# # authenticate (`gh auth status` inside the sandbox reports it invalid), and the VM cannot
# # push regardless — `git push` dies on "could not read Username", because no credential
# # helper is wired. `sbx create` offers no flag to suppress it and `sbx secret ls` scopes
# # it to no factory sandbox, so there is nothing to remove from this side; the fix is
# # sbx's. Every run records this as a warning, and a credential name that is *not* listed
# # here blocks the run rather than riding in unseen.
# acknowledged_env_credentials = ["GH_TOKEN"]
# # §15.2's sensitive-path Tier-2 trigger. Unchanged in scope from the table this moved out
# # of `src/factory/steps/review.py`: the AI subtree is the part of this repository where a
# # small diff can be expensive to get wrong. Ten directories here carry their own AGENTS.md
# # and widening the list to all of them would fire the nine-axis fan-out on nearly every
# # change — a spend decision, made here where it can be read and edited rather than in the
# # control plane where it could not.
# sensitive_paths = ["src/app/ai/**"]
# [projects.python-harness.env]
# UV_PROJECT_ENVIRONMENT = "/home/agent/venvs/python-harness"

[projects.nemoclaw-dev]
# Team BAC, inherited from the retired python-harness block above. The team key is the
# *routing* key (§10.2 step 1): a BAC ticket now means nemoclaw-dev and nothing else.
# Old BAC tickets in Linear are python-harness work and are all terminal — checked
# 2026-08-31, 6 blocked / no `awaiting_human` / no branches — so nothing in the store is
# orphaned by the handover.
team           = "BAC"
path           = "/Users/james/nexus-core/nemoclaw-dev"
# SSH, not HTTPS. The host pushes with ~/.ssh/id_ed25519_gitlab (pinned for this IP in
# ~/.ssh/config with IdentitiesOnly), which sidesteps the instance's internal CA — the
# ORAN issuer is not in the System keychain and an HTTPS remote would fail verification.
remote         = "git@172.18.194.183:nexus-core/ran-ai-agents/nemoclaw-test.git"
# §13.2 — the forge is GitLab. *Where* the push happens is the `[sandbox_delivery]`
# sub-table at the bottom of this block; without it, delivery is host-side through `glab`
# exactly as the GitHub projects go through `gh`.
forge          = "gitlab"
# Must exist on the remote as `origin/james/feat/prototype` — `Project.base_ref` is always
# the remote ref, and worktree creation resolves it before any model spend.
base_branch    = "james/feat/prototype"
stack          = "python"
# Same reasoning as the retired block: the stock image carries node and uv, so the
# layer-A .mjs hooks can spawn and no custom template is needed.
template       = ""
kits           = []
static_mcp     = []
build_sandbox  = "factory-build-nemoclaw-dev"
review_sandbox = "factory-review-nemoclaw-dev"
vault_mount    = "rw"
# Dead config, kept for the same reason the rest of the file keeps its findings: parsed
# into `Project` and read by nothing. Egress is decided entirely by daemon-side `sbx
# policy` rules, and the instance is reachable from this project's sandbox because of a
# *global* allow rule, not because of anything in this list.
network_allow  = ["pypi.org", "*.pythonhosted.org", "astral.sh"]
# Inherited from the measured finding on the retired project: `sbx` puts a 40-character
# `gho_` value in every sandbox's environment, invisible to `sbx inspect`. It does not
# authenticate and the VM cannot push regardless, so it is acknowledged (recorded as a
# warning every run) rather than left to block. Re-measure rather than assume when this
# project's first sandbox is created.
acknowledged_env_credentials = ["GH_TOKEN"]
# Empty is a real answer (§15.2): the repo has no code yet, so there is no subtree whose
# risk profile is known. A glob matching nothing would read exactly like a trigger that
# never fired — the mistake the frontend entry made — so this stays empty until there is
# something to name.
sensitive_paths = []
# Above the `[defaults]` floor of 1, for this project only (§11.3). Two unattended runs
# share this repository's `.git`, so the raise is a claim about *this* repository: each
# ticket still gets its own worktree and branch, and the second writer's `git worktree
# add` is the only contended operation. Two is deliberately not four — it is the smallest
# raise that proves the per-project limit works, and the number to revisit once a run
# pair has actually overlapped here.
concurrency_per_project = 2

# §13.2, deliberately reversed for this project and no other. James asked for the
# sandbox to open its own merge requests; the concern was raised twice and the decision
# is his. Deleting these four lines restores the full-strength boundary with **no code
# revert** — `policy.capability_secrets` admits `placeholder_env` only because this table
# names it, and `delivery/forge.py` picks the in-VM adapter only when this table exists.
# That reversibility is the condition the reversal was approved under.
#
# What crosses into the VM is an `sbx secret set-custom` **placeholder**, never the
# `glpat-`. The proxy substitutes the real token into the outbound request on the way to
# `api_url`, so the agent gains a capability bounded to one host and one sandbox scope;
# off-proxy the string means nothing. Proven end to end on 2026-09-01: a push and merge
# request `!1` on nemoclaw-test, from inside a sandbox holding no credential.
#
# There is no `ca_file` key and that absence is load-bearing — the VM is offered the sbx
# proxy's certificate, not the instance's, and the image already trusts that CA.
# `delivery/sandbox_gitlab.py` has the measurements.
#
# Provision the secret before the first run (the preflight fails the run if it is absent):
#   sbx secret set-custom --sandbox factory-build-nemoclaw-dev \
#       --env FACTORY_GITLAB_TOKEN --target 172.18.194.183
[projects.nemoclaw-dev.sandbox_delivery]
api_url      = "https://172.18.194.183"
project_path = "nexus-core/ran-ai-agents/nemoclaw-test"
placeholder_env  = "FACTORY_GITLAB_TOKEN"

[projects.nemoclaw-dev.env]
# The bind-mount hazard, unchanged: a sandbox `uv sync` against the bind-mounted
# workspace overwrites the host's .venv with a linux-aarch64 one and leaves
# .venv/bin/python a broken symlink (p0-3-toolchain.md).
#
# `{run}` is per *ticket*, and it is what makes `concurrency_per_project = 2` above
# safe. The build sandbox is named once per project, so two tickets running at once
# share one VM: pointed at a single directory, a `uv sync` in one run rewrites the
# virtualenv the other is running its gates against — the same hazard again, moved
# inside the VM, and invisible from the victim's transcript. `Context.env` substitutes
# the ticket per exec. It costs one `uv sync` per run.
UV_PROJECT_ENVIRONMENT = "/home/agent/venvs/nemoclaw-dev/{run}"

