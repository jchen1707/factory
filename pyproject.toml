[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factory"
version = "0.1.0"
description = "Layer D — the control plane. Drives one approved Linear ticket through a sandboxed agent and stops at the boundary a human owns."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "jchen" }]
# Stdlib only, deliberately, for everything that drives a run. The control plane
# shells out to `git`, `gh`, `sbx` and `security`, reads TOML with `tomllib` and
# speaks Linear's GraphQL over `urllib`. Adding a dependency here is a decision to
# review, not a convenience: this process holds the keychain credential and runs
# unattended. The one exception is the §18.5 operator console (`factory serve`),
# a loopback-only, read-mostly web view that holds no credential of its own — it
# reads the same SQLite file the daemon writes and shells out to the same `sbx`/
# `gh`. FastAPI/uvicorn/pydantic/structlog arrive with it and not before.
dependencies = [
    # `factory serve` (§18.5) — the loopback operator console only.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    # Pinned exactly, not floored. `ruff format` is a formatter and its output changes
    # between releases; `ruff format --check` is one of this repo's four Definition-of-Done
    # gates. Under `>=0.6` a ruff release re-formats files nobody touched and the DoD goes
    # red on `main`, out from under whatever run is in flight — measured on 2026-08-22,
    # when 0.16.4 failed five files on `main` before anyone had made a change. Bump this
    # line deliberately, in a commit that also carries the reformat.
    "ruff==0.16.4",
    "mypy>=1.11",
    "pytest>=8.3",
    # `fastapi.testclient` only — it drives the §18.5 console's routes in-process. A test
    # dependency, deliberately not a runtime one: the console itself makes no HTTP calls.
    "httpx2",
]

[project.scripts]
factory = "factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.ruff]
line-length = 100
target-version = "py312"
# `docs/` is not source. `SOFTWARE-FACTORY-PLAN.md` is the specification and
# `docs/discovery/` is Phase 0's dated evidence, both marked protected in
# harness.config.json — and ruff formats Python fenced in Markdown as well as Python
# files, so without this a `ruff format .` silently rewrites the record it is meant to
# be checked against.
extend-exclude = ["docs", "SOFTWARE-FACTORY-PLAN.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4", "PIE", "PT", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
# The control plane's whole job is to drive other programs. Every argv in these
# modules is a fixed list built from validated config — never a shell string, never
# user text — which is the property `harness.config.schema.json`'s `$defs.argv`
# exists to enforce and the reason `shell=True` appears nowhere in this repository.
"src/factory/sandbox/sbx.py" = ["S603", "S607"]
"src/factory/repo.py" = ["S603", "S607"]
"src/factory/harness.py" = ["S603", "S607"]
"src/factory/agent/codex.py" = ["S603", "S607"]
"src/factory/intake/linear.py" = ["S603", "S607"]
"src/factory/steps/sandbox.py" = ["S603", "S607"]
"src/factory/delivery/github.py" = ["S603", "S607"]
"src/factory/cli.py" = ["S603", "S607"]
"src/factory/gc.py" = ["S603", "S607"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
